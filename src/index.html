<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyShop</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MyShop - Discover the best products at the best prices.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Preconnect to reduce DNS + TLS handshake latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Single merged font request (Inter + Manrope) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Material Symbols: fixed weight 400 only (avoids downloading the full variable font range) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">

  <!-- Google Sign-In (deferred so it never blocks page render) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>كانتين سان مارك</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="كانتين سان مارك - اطلب منتجات الكانتين بسهولة وجودة عالية. تسوق من أفضل المنتجات لدعم أنشطة الكنيسة.">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Arabic Fonts: Cairo + Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <app-root>
    <!-- Kantyn San Mark Initial Loader -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #FAF7F2; }
      .initial-loader {
        position: fixed;
        inset: 0;
        background: #FAF7F2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
        gap: 20px;
      }
      .loader-logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: pulse-logo 2s ease-in-out infinite;
      }
      .loader-icon-circle {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 3px solid #C4962A;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(123,24,24,0.18);
      }
      .loader-logo-text {
        font-family: 'Cairo', sans-serif;
        font-size: 1.4rem;
        font-weight: 900;
        color: #7B1818;
        text-align: center;
        line-height: 1.2;
      }
      .loader-logo-sub {
        font-family: 'Tajawal', sans-serif;
        font-size: 0.75rem;
        color: #8C7355;
        letter-spacing: 0.05em;
      }
      .loader-bar {
        width: 100px;
        height: 3px;
        background: rgba(123, 24, 24, 0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        width: 40%;
        height: 100%;
        background: #7B1818;
        border-radius: 10px;
        animation: slide-loader 1.5s infinite ease-in-out;
      }
      @keyframes pulse-logo {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.97); }
      }
      @keyframes slide-loader {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
    <div class="initial-loader" id="app-loader">
      <div class="loader-logo-wrap">
        <div class="loader-icon-circle">
          <img src="assets/images/2.png" alt="Kantyn San Mark"
               style="width:100%; height:100%; object-fit:contain; display:block;">
        </div>
        <div class="loader-logo-text">كانتين سان مارك</div>
        <div class="loader-logo-sub">Kantyn San Mark</div>
      </div>
      <div class="loader-bar"></div>
    </div>
  </app-root>
</body>
</html>

<div class="profile-page min-h-screen bg-gray-100 py-8 px-4">
  <div class="max-w-2xl mx-auto">
    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>
    
    <!-- Error State -->
    <div *ngIf="error && !loading" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      {{ error }}
    </div>
    
    <!-- Profile Content -->
    <div *ngIf="!loading && !error && profile" class="bg-white rounded-lg shadow-md overflow-hidden">
      <!-- Header with Photo -->
      <div class="bg-gradient-to-r from-blue-600 to-blue-800 h-32"></div>
      
      <div class="px-6 pb-6">
        <!-- Profile Photo -->
        <div class="relative -mt-16 mb-4 flex">
          <div class="relative group">
            <div class="w-32 h-32 rounded-full border-4 border-white bg-gray-200 overflow-hidden flex items-center justify-center relative">
              <img *ngIf="getPhotoUrl()" 
                   [src]="getPhotoUrl()" 
                   alt="Profile Photo" 
                   class="w-full h-full object-cover">
              <span *ngIf="!getPhotoUrl()" class="text-4xl text-gray-400">
                {{ profile.firstName.charAt(0) }}{{ profile.lastName.charAt(0) }}
              </span>
              
              <!-- Upload overlay -->
              <div *ngIf="isOwnProfile" 
                   class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
                   (click)="fileInput.click()">
                <svg *ngIf="!uploadingPhoto" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <div *ngIf="uploadingPhoto" class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
              </div>
            </div>
            
            <!-- Hidden file input -->
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden">
          </div>
          
          <div *ngIf="uploadError" class="ml-4 rtl:mr-4 rtl:ml-0 self-end text-sm text-red-600 mb-2">
            {{ uploadError }}
          </div>
        </div>
        
        <!-- User Info -->
        <div class="mb-6">
          <h1 class="text-3xl font-bold text-gray-800">{{ getFullName() }}</h1>
          <p class="text-gray-500">Member since {{ getCreatedDate() }}</p>
        </div>
        
        <!-- Details Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- First Name -->
          <div class="bg-gray-50 rounded-lg p-4">
            <label class="block text-sm font-medium text-gray-500 mb-1">First Name</label>
            <p class="text-gray-800 font-semibold">{{ profile.firstName }}</p>
          </div>
          
          <!-- Last Name -->
          <div class="bg-gray-50 rounded-lg p-4">
            <label class="block text-sm font-medium text-gray-500 mb-1">Last Name</label>
            <p class="text-gray-800 font-semibold">{{ profile.lastName }}</p>
          </div>
          
          <!-- Gender -->
          <div class="bg-gray-50 rounded-lg p-4">
            <label class="block text-sm font-medium text-gray-500 mb-1">Gender</label>
            <p class="text-gray-800 font-semibold">{{ getGenderText() }}</p>
          </div>
          
          <!-- Created Date -->
          <div class="bg-gray-50 rounded-lg p-4">
            <label class="block text-sm font-medium text-gray-500 mb-1">Account Created</label>
            <p class="text-gray-800 font-semibold">{{ getCreatedDate() }}</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- No Profile Data -->
    <div *ngIf="!loading && !error && !profile" class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded relative">
      No profile data available
    </div>
  </div>
</div>
